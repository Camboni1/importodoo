spring.application.name=Odoo Import Tool

# Server
server.port=8080
spring.autoconfigure.exclude=org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration

# Virtual threads (Java 21+ / Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# H2 file-based database (survives restarts)
spring.datasource.url=jdbc:h2:file:./data/odoo_import;AUTO_SERVER=TRUE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits (large file support)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=import-

# App config
app.upload.dir=${user.home}/odoo-import-uploads
app.import.batch-size=100
app.import.large-file-threshold-mb=10
