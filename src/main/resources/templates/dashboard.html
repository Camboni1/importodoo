<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/head :: head('Tableau de bord')}"></head>
<body class="app-body">
<div class="d-flex h-100">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-grow-1 overflow-auto">
        <div class="topbar d-flex align-items-center px-4 py-3">
            <h1 class="h5 mb-0 fw-semibold">Tableau de bord</h1>
            <a href="/import" class="btn btn-primary btn-sm ms-auto">
                <i class="bi bi-plus-lg me-1"></i>Nouvel import
            </a>
        </div>

        <div class="content-area px-4 py-3">

            <!-- Flash messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Stats cards -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-primary-subtle text-primary rounded-3 p-3">
                                <i class="bi bi-file-earmark-arrow-up fs-4"></i>
                            </div>
                            <div>
                                <div class="stat-value" th:text="${totalJobs}">0</div>
                                <div class="stat-label">Total imports</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-warning-subtle text-warning rounded-3 p-3">
                                <i class="bi bi-arrow-repeat fs-4"></i>
                            </div>
                            <div>
                                <div class="stat-value" th:text="${runningJobs}">0</div>
                                <div class="stat-label">En cours</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-danger-subtle text-danger rounded-3 p-3">
                                <i class="bi bi-exclamation-octagon fs-4"></i>
                            </div>
                            <div>
                                <div class="stat-value" th:text="${failedJobs}">0</div>
                                <div class="stat-label">Échoués</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-success-subtle text-success rounded-3 p-3">
                                <i class="bi bi-plug fs-4"></i>
                            </div>
                            <div>
                                <div class="stat-value" th:text="${connections.size()}">0</div>
                                <div class="stat-label">Connexions</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <!-- Recent jobs -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-transparent d-flex align-items-center">
                            <span class="fw-semibold">Imports récents</span>
                            <a href="/jobs" class="ms-auto btn btn-link btn-sm text-decoration-none">Voir tout</a>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${recentJobs.empty}" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                Aucun import encore. <a href="/import">Démarrer un import</a>
                            </div>
                            <div th:if="${!recentJobs.empty}" class="table-responsive">
                                <table class="table table-hover mb-0 align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Fichier</th>
                                            <th>Modèle</th>
                                            <th>Statut</th>
                                            <th class="text-end">Lignes</th>
                                            <th>Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="job : ${recentJobs}">
                                            <td>
                                                <a th:href="@{/jobs/{id}(id=${job.id})}" class="text-decoration-none fw-medium"
                                                   th:text="${job.fileName}">file.xlsx</a>
                                            </td>
                                            <td>
                                                <code class="small" th:text="${job.odooModel}">res.partner</code>
                                            </td>
                                            <td>
                                                <span class="badge"
                                                      th:classappend="${job.status.name() == 'COMPLETED' ? 'bg-success' : job.status.name() == 'FAILED' ? 'bg-danger' : job.status.name() == 'RUNNING' ? 'bg-warning text-dark' : job.status.name() == 'CANCELLED' ? 'bg-secondary' : 'bg-light text-dark'}"
                                                      th:text="${job.status}">PENDING</span>
                                            </td>
                                            <td class="text-end">
                                                <span class="text-success small" th:text="${job.successRows}">0</span>
                                                <span class="text-muted small"> / </span>
                                                <span class="small" th:text="${job.totalRows}">0</span>
                                            </td>
                                            <td class="text-muted small" th:text="${#temporals.format(job.createdAt,'dd/MM HH:mm')}">-</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Connections panel -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-transparent d-flex align-items-center">
                            <span class="fw-semibold">Connexions Odoo</span>
                            <a href="/connections/new" class="ms-auto btn btn-link btn-sm text-decoration-none">
                                <i class="bi bi-plus"></i> Ajouter
                            </a>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${connections.empty}" class="text-center py-4 text-muted">
                                <i class="bi bi-plug fs-2 d-block mb-2"></i>
                                <a href="/connections/new">Ajouter une connexion</a>
                            </div>
                            <ul th:if="${!connections.empty}" class="list-group list-group-flush">
                                <li th:each="conn : ${connections}"
                                    class="list-group-item d-flex align-items-center gap-2 px-3">
                                    <i th:class="${conn.lastTestSuccess == true ? 'bi bi-circle-fill text-success' :
                                                  conn.lastTestSuccess == false ? 'bi bi-circle-fill text-danger' :
                                                  'bi bi-circle text-muted'}"
                                       style="font-size:.55rem"></i>
                                    <div class="flex-grow-1 min-w-0">
                                        <div class="fw-medium text-truncate" th:text="${conn.name}">Conn</div>
                                        <div class="text-muted small text-truncate" th:text="${conn.url}">url</div>
                                    </div>
                                    <a th:href="@{/connections/{id}/edit(id=${conn.id})}"
                                       class="btn btn-sm btn-outline-secondary py-0">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
